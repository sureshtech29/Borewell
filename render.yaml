services:
  # ---------------------------------------------------------
  # Borewell Backend API (FastAPI)
  # Free Web Service on Render
  # ---------------------------------------------------------
  - type: web
    name: borewell-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-access-log --proxy-headers --forwarded-allow-ips=*
    healthCheckPath: /api/health
    envVars:
      - key: APP_DATA_MODE
        value: demo
      - key: APP_DATA_BACKEND
        value: memory
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: 3.12.0

  # ---------------------------------------------------------
  # Borewell Frontend (React + Vite)
  # Free Static Site on Render
  # ---------------------------------------------------------
  - type: web
    name: borewell-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
