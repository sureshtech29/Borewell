services:
  # Production API. Set DATABASE_URL in the Render dashboard to the
  # PostgreSQL Internal Database URL before deploying.
  - type: web
    name: borewell-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-access-log --proxy-headers --forwarded-allow-ips=*
    healthCheckPath: /api/health
    envVars:
      - key: APP_DATA_MODE
        value: production
      - key: APP_DATA_BACKEND
        value: postgis
      - key: APP_STATE
        value: telangana
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: 3.12.0

  # Frontend remains a static site. Configure VITE_API_BASE_URL to the
  # deployed borewell-api URL if it is not already configured in Render.
  - type: web
    name: borewell-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
